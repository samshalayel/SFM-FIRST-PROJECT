<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة المحراث للزراعة الحديثة</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .hero { background-image: url('https://example.com/agriculture-hero.jpg'); height: 50vh; background-size: cover; color: white; text-align: center; display: flex; align-items: center; justify-content: center; }
        .hero h1 { font-size: 3em; }
        .services { padding: 20px; text-align: center; }
        .service { margin: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="hero">
        <div>
            <h1>الخدمات الزراعية الحديثة</h1>
            <p>أفضل التقنيات لإنتاج زراعي فعال</p>
        </div>
    </div>
    <div class="services">
        <div class="service">
            <h2>خدمة حراثة الحقول</h2>
            <p>نقدم أحدث تقنيات الحراثة لتحسين جودة الإنتاج الزراعي.</p>
            <button>تعرف على المزيد</button>
        </div>
        <div class="service">
            <h2>نظام الري الذكي</h2>
            <p>توفير المياه وزيادة الإنتاج باستخدام نظم الري الحديثة.</p>
            <button>اعرف أكثر</button>
        </div>
        <div class="service">
            <h2>معدات زراعية مبتكرة</h2>
            <p>استمتع بالتكنولوجيا الحديثة لزيادة إنتاجك.</p>
            <button>اكتشف الآن</button>
        </div>
    </div>
</body>
</html>
